name: build

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        shell: bash
        run: ./gradlew :cli:installDist --console=plain

      - name: Test
        shell: bash
        run: ./gradlew :core:jvmTest --console=plain

      - name: Smoke test (no device attached)
        shell: bash
        run: ./cli/build/install/noir/bin/noir devices || true

      - uses: actions/upload-artifact@v7
        with:
          name: noir-${{ matrix.os }}
          path: cli/build/install/noir
          if-no-files-found: error
