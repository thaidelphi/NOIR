name: release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build distribution
        shell: bash
        run: ./gradlew :cli:installDist -PnoirVersion="${GITHUB_REF_NAME#v}" --console=plain

      - name: Package app image (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          MAIN_JAR="$(basename "$(ls cli/build/install/noir/lib/cli-*.jar | head -1)")"
          mkdir -p stage release
          jpackage \
            --type app-image \
            --name NOIR \
            --input cli/build/install/noir/lib \
            --main-jar "$MAIN_JAR" \
            --main-class app.noir.cli.MainKt \
            --dest stage \
            --app-version 1.0.0 \
            --vendor Verlintas \
            --description "Android leak audit" \
            --java-options "-Dfile.encoding=UTF-8" \
            --jlink-options "--strip-debug --no-man-pages --no-header-files --compress=2"

          if [ "${{ runner.os }}" = "macOS" ]; then
            cat > "stage/Start NOIR.command" <<'SH'
          #!/bin/bash
          cd "$(dirname "$0")" || exit 1
          ./NOIR.app/Contents/MacOS/NOIR "$@"
          echo
          read -n 1 -s -r -p "press any key to close"
          SH
            chmod +x "stage/Start NOIR.command"
            "stage/NOIR.app/Contents/MacOS/NOIR" --version
            (cd stage && zip -qry "../release/noir-${GITHUB_REF_NAME}-macOS-portable.zip" .)
          else
            cat > "stage/Start-NOIR.sh" <<'SH'
          #!/bin/sh
          cd "$(dirname "$0")" || exit 1
          ./NOIR/bin/NOIR "$@"
          echo
          printf "press Enter to close"; read _
          SH
            chmod +x "stage/Start-NOIR.sh"
            "stage/NOIR/bin/NOIR" --version
            (cd stage && zip -qry "../release/noir-${GITHUB_REF_NAME}-Linux-portable.zip" .)
          fi

      - name: Package app image (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $mainJar = (Get-ChildItem cli/build/install/noir/lib/cli-*.jar | Select-Object -First 1).Name
          New-Item -ItemType Directory -Force -Path stage, release | Out-Null
          jpackage `
            --type app-image `
            --name NOIR `
            --input cli/build/install/noir/lib `
            --main-jar $mainJar `
            --main-class app.noir.cli.MainKt `
            --dest stage `
            --app-version 1.0.0 `
            --vendor Verlintas `
            --description "Android leak audit" `
            --win-console `
            --java-options "-Dfile.encoding=UTF-8" `
            --jlink-options "--strip-debug --no-man-pages --no-header-files --compress=2"
          @"
          @echo off
          chcp 65001 >nul
          cd /d "%~dp0"
          "NOIR\runtime\bin\java.exe" -Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -Dstderr.encoding=UTF-8 -cp "NOIR\app\*" app.noir.cli.MainKt %*
          echo.
          pause
          "@ | Set-Content -Encoding ASCII "stage\Start NOIR.bat"
          $v = & "stage\NOIR\NOIR.exe" --version
          if ($v -notmatch "NOIR") { throw "NOIR.exe did not run: [$v]" }
          Compress-Archive -Path stage\* -DestinationPath "release/noir-$env:GITHUB_REF_NAME-Windows-portable.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: noir-${{ runner.os }}
          path: release/*.zip
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: checksums
        run: |
          cd release
          sha256sum *.zip > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            release/*.zip
            release/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
